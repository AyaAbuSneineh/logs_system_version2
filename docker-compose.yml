services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logs
      POSTGRES_PASSWORD: logs
      POSTGRES_DB: logs
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "wal_writer_delay=200ms"
      - "-c"
      - "checkpoint_timeout=15min"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "log_min_duration_statement=500"
      - "-c"
      - "deadlock_timeout=1s"
      - "-c"
      - "max_parallel_workers_per_gather=0"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logs -d logs"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    # deploy.resources.limits only applies under `docker stack deploy`;
    # mem_limit/cpus enforce the same limits under plain `docker compose up`.
    mem_limit: 1024m
    cpus: 1.0

  app:
    build:
      context: ./app
    environment:
      PORT: 8080
      HOST: "0.0.0.0"
      DATABASE_URL: "postgres://logs:logs@postgres:5432/logs"
      DB_WRITE_POOL_MAX: 3
      DB_WRITE_POOL_MIN: 1
      DB_READ_POOL_MAX: 4
      DB_READ_POOL_MIN: 1
      RETENTION_DAYS: 30
      RETENTION_SWEEP_INTERVAL_MS: 3600000
      PARTITION_LOOKAHEAD_DAYS: 3
      PARTITION_MAINTENANCE_INTERVAL_MS: 900000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    mem_limit: 256m
    cpus: 0.5

volumes:
  pgdata:
