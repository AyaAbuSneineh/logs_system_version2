name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  contract-smoke:
    name: Contract smoke test (docker compose)
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      matrix:
        # The required-contract smoke test must pass with auth off (the
        # zero-config default this service always runs in) and would also
        # run against AUTH_ENABLED=true if authentication were implemented
        # (see README — it currently is not, so only the default applies).
        auth_enabled: [false]
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "Service is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Service did not become healthy in time"
          docker compose logs
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run contract smoke test
        run: node scripts/smoke-test.mjs

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
